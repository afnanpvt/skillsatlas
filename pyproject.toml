[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsatlas"
version = "0.1.0"
description = "A visual directory of every Claude Code skill on your machine. Find the skill you forgot you had."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Afnan" }]
keywords = ["claude", "claude-code", "skills", "directory", "dashboard", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/afnanpvt/skillsatlas"
Issues = "https://github.com/afnanpvt/skillsatlas/issues"
Source = "https://github.com/afnanpvt/skillsatlas"

[project.scripts]
skillsatlas = "skillsatlas.server:main"

[tool.setuptools]
packages = ["skillsatlas"]

[tool.setuptools.package-data]
skillsatlas = ["index.html"]
